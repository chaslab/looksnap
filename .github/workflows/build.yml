name: build
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            cmd: npx electron-builder --win nsis --publish never
          - os: macos-latest
            cmd: npx electron-builder --mac dmg --arm64 --x64 --publish never
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci || npm install
      - run: ${{ matrix.cmd }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: looksnap-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
